name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: tag must match the published crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo pkgid -p undercoat | sed 's/.*[#@]//; s/:.*//')
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match crate version ${version}" >&2
            exit 1
          fi
          echo "publishing undercoat ${version}"

      - run: cargo fmt --all --check
      - run: cargo test --workspace

      - name: cargo publish
        run: cargo publish -p undercoat --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
