<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="964" viewBox="0 0 1000 964" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">undercoat compilation pipeline</title>
  <desc id="desc">Six stages from source file to CSS bytes. Only evaluation forks into less and scss; every Span is a merged-text offset.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="964" fill="#ffffff"/>

  <text x="32" y="46" font-size="19" font-weight="600" fill="#1f2328">Compilation pipeline</text>
  <text x="32" y="70" font-size="13" fill="#59636e">One entry file in, CSS bytes out. Only stage ③ forks by dialect.</text>
  <line x1="32" y1="82" x2="968" y2="82" stroke="#d8dee4" stroke-width="1"/>

  <rect x="420" y="92" width="160" height="40" rx="8" fill="#ffffff" stroke="#afb8c1" stroke-width="1"/>
  <text x="500" y="118" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Source file</text>

  <path d="M500 132 V154" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="140" y="154" width="720" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="500" y="178" font-size="14" text-anchor="middle" fill="#1f2328"><tspan fill="#0969da" font-weight="700">①</tspan><tspan xml:space="preserve" font-weight="600"> Assembly · merge::Merged</tspan></text>
  <text x="500" y="198" font-size="13" fill="#59636e" text-anchor="middle">merged text + segment table (Seg)</text>

  <path d="M500 214 V236" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="140" y="236" width="720" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="500" y="260" font-size="14" text-anchor="middle" fill="#1f2328"><tspan fill="#0969da" font-weight="700">②</tspan><tspan xml:space="preserve" font-weight="600"> Parse · oxc-css-parser</tspan></text>
  <text x="500" y="280" font-size="13" fill="#59636e" text-anchor="middle">lexing and parsing only; the AST carries Span</text>

  <path d="M500 296 V318" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="140" y="318" width="720" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="500" y="342" font-size="14" text-anchor="middle" fill="#1f2328"><tspan fill="#0969da" font-weight="700">③</tspan><tspan xml:space="preserve" font-weight="600"> Evaluate (dialect fork)</tspan></text>
  <text x="500" y="362" font-size="13" fill="#59636e" text-anchor="middle">the only genuinely dialect-specific step</text>

  <path d="M500 378 V398 H314 V418" fill="none" stroke="#8c959f" stroke-width="1.4"/>
  <path d="M500 378 V398 H686 V418" fill="none" stroke="#8c959f" stroke-width="1.4"/>

  <rect x="140" y="418" width="348" height="76" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="314" y="442" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">less: evaluate while walking</text>
  <text x="314" y="462" font-size="13" fill="#59636e" text-anchor="middle">value = CSS text + lazy bindings</text>
  <text x="314" y="482" font-size="13" fill="#0969da" text-anchor="middle">less::Compiler</text>

  <rect x="512" y="418" width="348" height="76" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="686" y="442" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">scss: evaluate into typed Value</text>
  <text x="686" y="462" font-size="13" fill="#59636e" text-anchor="middle">value = typed SassScript values</text>
  <text x="686" y="482" font-size="13" fill="#0969da" text-anchor="middle">scss::Converter</text>

  <path d="M314 494 V510 H500" fill="none" stroke="#8c959f" stroke-width="1.4"/>
  <path d="M686 494 V510 H500" fill="none" stroke="#8c959f" stroke-width="1.4"/>
  <path d="M500 510 V528" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="140" y="528" width="720" height="80" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="500" y="552" font-size="14" text-anchor="middle" fill="#1f2328"><tspan fill="#0969da" font-weight="700">④</tspan><tspan xml:space="preserve" font-weight="600"> Shared IR · doc::Item</tspan></text>
  <text x="500" y="572" font-size="13" fill="#59636e" text-anchor="middle">Rule / AtRule / Decl / Comment / Keyframe</text>
  <text x="500" y="592" font-size="13" fill="#59636e" text-anchor="middle">every node carries its source Span; selectors are split per output line</text>

  <path d="M500 608 V630" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="140" y="630" width="720" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="500" y="654" font-size="14" text-anchor="middle" fill="#1f2328"><tspan fill="#0969da" font-weight="700">⑤</tspan><tspan xml:space="preserve" font-weight="600"> Print · doc::print (Style-driven)</tspan></text>
  <text x="500" y="674" font-size="13" fill="#59636e" text-anchor="middle">append-only: tokens carry spans, generated text goes through raw</text>

  <path d="M500 690 V712" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="140" y="712" width="720" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="500" y="736" font-size="14" text-anchor="middle" fill="#1f2328"><tspan fill="#0969da" font-weight="700">⑥</tspan><tspan xml:space="preserve" font-weight="600"> Printer + sourcemap</tspan></text>
  <text x="500" y="756" font-size="13" fill="#59636e" text-anchor="middle">mapped back through the segment table, then VLQ-encoded</text>

  <path d="M500 772 V794" fill="none" stroke="#8c959f" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="390" y="794" width="220" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="500" y="820" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">CSS bytes + .map</text>

  <rect x="120" y="862" width="760" height="78" rx="6" fill="#f6f8fa"/>
  <rect x="120" y="862" width="3" height="78" rx="1.5" fill="#0969da"/>
  <text x="142" y="884" font-size="13" font-weight="600" fill="#1f2328">Note: every Span is in merged-text coordinates.</text>
  <text x="142" y="904" font-size="13" fill="#59636e">Errors and source maps both go back through the segment table</text>
  <text x="142" y="924" font-size="13" fill="#59636e">to reach a real file plus line and column.</text>
</svg>
